<html>

<head>

<style>
  html, body { margin: 0; height: 100%; }
  #counter {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    text-align: center;
    padding: 8px 0;
    font-family: monospace;
    font-size: 20px;
    color: white;
    text-shadow: 1px 1px 2px black, -1px -1px 2px black;
  }
  #gameover {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.75);
    color: white;
    font-family: monospace;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  #finalMs {
    font-size: 40px;
    margin-bottom: 8px;
  }
  #finalMisses {
    font-size: 20px;
    margin-bottom: 24px;
  }
  #restartBtn {
    padding: 16px 32px;
    font-size: 20px;
    border: none;
    border-radius: 8px;
    background: #4CAF50;
    color: white;
    cursor: pointer;
  }
  #target {
    position: fixed;
    border-radius: 50%;
    background: white;
    border: 4px solid black;
    box-sizing: border-box;
    z-index: 10;
  }
</style>

<script>
var colors =['red', 'green', 'blue', 'yellow', 'grey', 'white', 'black', 'orange', 'cyan'];
var isfs = false;
var freq = 100;
var duration = 900;

var startTime = null;
var timerInterval = null;
var finished = false;
var missCount = 0;

a=new AudioContext();

function beep(vol, freq, duration){
  v=a.createOscillator()
  u=a.createGain()
  v.connect(u)
  v.frequency.value=freq
  v.type="square"
  u.connect(a.destination)
  u.gain.value=vol*0.01
  v.start(a.currentTime)
  v.stop(a.currentTime+duration*0.001)
}

function randomInt(min,max) {
    return Math.floor(Math.random()*(max-min+1)+min);
}

function positionTarget() {
   var target = document.getElementById('target');
   var w = window.innerWidth;
   var h = window.innerHeight;
   var diameter = Math.min(2 * Math.sqrt(0.05 * w * h / Math.PI), Math.min(w,h));
   var x = Math.random() * (w - diameter);
   var y = Math.random() * (h - diameter);
   target.style.width = diameter + 'px';
   target.style.height = diameter + 'px';
   target.style.left = x + 'px';
   target.style.top = y + 'px';
}

function updateCounter() {
   document.getElementById('timeDisplay').textContent = (Date.now() - startTime) + ' ms';
}

function registerMiss() {
   missCount++;
   document.getElementById('missDisplay').textContent = 'Fallos: ' + missCount;
   document.getElementById('finalMisses').textContent = 'Fallos: ' + missCount;
}

function startTimer() {
   if(startTime === null && !finished){
      startTime = Date.now();
      timerInterval = setInterval(updateCounter, 30);
   }
}

function stopTimer() {
   clearInterval(timerInterval);
   timerInterval = null;
   finished = true;
}

function endGame() {
   var elapsed = startTime !== null ? (Date.now() - startTime) : 0;
   stopTimer();
   document.getElementById('counter').style.display = 'none';
   document.getElementById('target').style.display = 'none';
   document.getElementById('finalMs').textContent = elapsed + ' ms';
   document.getElementById('gameover').style.display = 'flex';
}

function changeBackground() {
   var id = randomInt(0,8);
   document.body.style.background = colors[id];
   beep(999,freq,duration);
   if(freq > 900){
      freq = 100
      endGame();
   } else {
      freq = freq + 5
   }
   if(duration<100){
      duration = 900
   }else{
      duration = duration - 5
   }
   if(!isfs){
      document.documentElement.requestFullscreen();
   }
   if(!finished){
      positionTarget();
   }
}

function handleInput(e) {
   if(e){
      e.preventDefault();
      e.stopPropagation();
   }
   if(finished){
      return;
   }
   startTimer();
   changeBackground();
}

function handleMiss(e) {
   if(e){
      e.preventDefault();
   }
   if(finished){
      return;
   }
   startTimer();
   registerMiss();
}

function restartGame(e) {
   if(e){
      e.preventDefault();
      e.stopPropagation();
   }
   freq = 100;
   duration = 900;
   startTime = null;
   finished = false;
   missCount = 0;
   document.getElementById('gameover').style.display = 'none';
   document.getElementById('counter').style.display = 'block';
   document.getElementById('timeDisplay').textContent = '0 ms';
   document.getElementById('missDisplay').textContent = 'Fallos: 0';
   document.getElementById('target').style.display = 'block';
   changeBackground();
}

window.addEventListener("load",function() { changeBackground(); });
</script>
</head>
<body onkeypress="handleInput(event)" ontouchend="handleMiss(event)" onclick="handleMiss(event)">
  <div id="counter">
    <span id="timeDisplay">0 ms</span> &middot; <span id="missDisplay">Fallos: 0</span>
  </div>
  <div id="target" ontouchend="handleInput(event)" onclick="handleInput(event)"></div>
  <div id="gameover">
    <div id="finalMs">0 ms</div>
    <div id="finalMisses">Fallos: 0</div>
    <button id="restartBtn" ontouchend="restartGame(event)" onclick="restartGame(event)">Recomenzar</button>
  </div>
</body>
</html>
